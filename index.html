<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>TKY Dungeon</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fade-delay: 2s;
      --fade-duration: 1.5s;
      --smoke-start-delay: 3.5s;
      --smoke-duration: 2.8s;
      --transition-delay: 6.4s;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      background: #000;
    }

    /* ===== Intro ===== */
    .intro {
      position: fixed;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
      z-index: 10;
    }

    .logo-wrap {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
    }

    .intro__logo {
      width: min(88vw, 88vh, 760px);
      max-height: 86vh;
      object-fit: contain;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.15));
      transition: opacity var(--fade-duration) ease-in-out;
      user-select: none;
      -webkit-user-drag: none;
    }

    .intro.logo-visible .intro__logo {
      opacity: 1;
    }

    /* ===== Smoke Layer ===== */
    .smoke-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .smoke {
      position: absolute;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.95) 0%,
          rgba(255,255,255,0.75) 22%,
          rgba(255,255,255,0.45) 45%,
          rgba(255,255,255,0.18) 62%,
          rgba(255,255,255,0.00) 75%);
      filter: blur(26px);
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(0.75);
      mix-blend-mode: screen;
    }

    /* 下から上に来る煙 */
    .smoke.bottom {
      bottom: -18vmin;
      left: var(--x, 50%);
      width: var(--size, 34vmin);
      height: var(--size, 34vmin);
      animation: none;
    }

    /* 左右からも少し寄せる */
    .smoke.left {
      left: -16vmin;
      top: var(--y, 50%);
      width: var(--size, 30vmin);
      height: var(--size, 30vmin);
      animation: none;
    }

    .smoke.right {
      right: -16vmin;
      top: var(--y, 50%);
      width: var(--size, 30vmin);
      height: var(--size, 30vmin);
      animation: none;
    }

    .intro.smoke-start .smoke.bottom {
      animation: smokeRise var(--smoke-duration) ease-out forwards;
      animation-delay: var(--delay, 0s);
    }

    .intro.smoke-start .smoke.left {
      animation: smokeFromLeft calc(var(--smoke-duration) * 0.95) ease-out forwards;
      animation-delay: var(--delay, 0s);
    }

    .intro.smoke-start .smoke.right {
      animation: smokeFromRight calc(var(--smoke-duration) * 0.95) ease-out forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes smokeRise {
      0% {
        opacity: 0;
        transform: translate(-50%, 12vmin) scale(0.7);
      }
      18% {
        opacity: 0.55;
      }
      50% {
        opacity: 0.75;
        transform: translate(-50%, -10vmin) scale(1.0);
      }
      100% {
        opacity: 0.95;
        transform: translate(-50%, -34vmin) scale(1.55);
      }
    }

    @keyframes smokeFromLeft {
      0% {
        opacity: 0;
        transform: translate(-6vmin, -50%) scale(0.75);
      }
      20% {
        opacity: 0.45;
      }
      55% {
        opacity: 0.68;
        transform: translate(18vmin, -50%) scale(1.05);
      }
      100% {
        opacity: 0.88;
        transform: translate(42vmin, -50%) scale(1.45);
      }
    }

    @keyframes smokeFromRight {
      0% {
        opacity: 0;
        transform: translate(6vmin, -50%) scale(0.75);
      }
      20% {
        opacity: 0.45;
      }
      55% {
        opacity: 0.68;
        transform: translate(-18vmin, -50%) scale(1.05);
      }
      100% {
        opacity: 0.88;
        transform: translate(-42vmin, -50%) scale(1.45);
      }
    }

    /* 全体が白煙で覆われる最終ベール */
    .smoke-veil {
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 68%, rgba(255,255,255,0.34), rgba(255,255,255,0.00) 35%),
        radial-gradient(circle at 30% 72%, rgba(255,255,255,0.28), rgba(255,255,255,0.00) 32%),
        radial-gradient(circle at 70% 72%, rgba(255,255,255,0.28), rgba(255,255,255,0.00) 32%),
        linear-gradient(to top, rgba(255,255,255,0.38), rgba(255,255,255,0.00) 40%);
      filter: blur(18px);
      transition: opacity 1.1s ease-in-out;
      pointer-events: none;
    }

    .intro.covered .smoke-veil {
      opacity: 1;
    }

    /* ロゴも煙に飲まれて少し見えにくくする */
    .intro.covered .intro__logo {
      opacity: 0.18;
      transition:
        opacity 1s ease-in-out,
        filter 1s ease-in-out;
      filter: blur(2px) drop-shadow(0 0 8px rgba(255,255,255,0.08));
    }

    /* ===== Main Screen (遷移先の仮画面) ===== */
    .main-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, #151515 0%, #0b0b0b 42%, #000 100%);
      color: #fff;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .main-screen.visible {
      opacity: 1;
      z-index: 20;
    }

    .main-screen__inner {
      text-align: center;
      padding: 24px;
    }

    .main-screen h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.08em;
    }

    .main-screen p {
      margin: 0;
      opacity: 0.8;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
    }

    @media (prefers-reduced-motion: reduce) {
      .intro__logo,
      .smoke-veil,
      .main-screen {
        transition-duration: 0.01ms !important;
      }

      .intro.smoke-start .smoke {
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Intro -->
  <section class="intro" id="intro" aria-label="TKY Dungeon スプラッシュ画面">
    <div class="logo-wrap">
      <img
        class="intro__logo"
        src="./assets/Icon.png"
        alt="TKY GAMES ロゴ"
        width="1254"
        height="1254"
      />
    </div>

    <div class="smoke-layer" aria-hidden="true">
      <!-- 下から上がる煙 -->
      <span class="smoke bottom" style="--x: 16%; --size: 24vmin; --delay: 0.00s;"></span>
      <span class="smoke bottom" style="--x: 28%; --size: 28vmin; --delay: 0.18s;"></span>
      <span class="smoke bottom" style="--x: 40%; --size: 34vmin; --delay: 0.06s;"></span>
      <span class="smoke bottom" style="--x: 52%; --size: 30vmin; --delay: 0.25s;"></span>
      <span class="smoke bottom" style="--x: 64%; --size: 36vmin; --delay: 0.14s;"></span>
      <span class="smoke bottom" style="--x: 76%; --size: 26vmin; --delay: 0.30s;"></span>
      <span class="smoke bottom" style="--x: 88%; --size: 22vmin; --delay: 0.08s;"></span>

      <!-- 左右から寄る煙 -->
      <span class="smoke left"  style="--y: 42%; --size: 28vmin; --delay: 0.22s;"></span>
      <span class="smoke left"  style="--y: 62%; --size: 34vmin; --delay: 0.34s;"></span>
      <span class="smoke right" style="--y: 44%; --size: 28vmin; --delay: 0.16s;"></span>
      <span class="smoke right" style="--y: 64%; --size: 34vmin; --delay: 0.28s;"></span>
    </div>

    <div class="smoke-veil" aria-hidden="true"></div>
  </section>

  <!-- 遷移先の仮画面 -->
  <main class="main-screen" id="mainScreen" aria-label="メイン画面">
    <div class="main-screen__inner">
      <h1>TKY DUNGEON</h1>
      <p>Press Start</p>
    </div>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const mainScreen = document.getElementById("mainScreen");

    // 0〜2秒: 真っ黒
    // 2〜3.5秒: ロゴフェードイン
    setTimeout(() => {
      intro.classList.add("logo-visible");
    }, 2000);

    // 3.5秒〜: 白い煙を出し始める
    setTimeout(() => {
      intro.classList.add("smoke-start");
    }, 3500);

    // 5.4秒〜: ロゴを白煙で覆う
    setTimeout(() => {
      intro.classList.add("covered");
    }, 5400);

    // 6.6秒〜: 次画面へ
    setTimeout(() => {
      mainScreen.classList.add("visible");
      intro.style.transition = "opacity 1s ease-in-out";
      intro.style.opacity = "0";
    }, 6600);

    // 7.7秒でイントロを非表示
    setTimeout(() => {
      intro.style.display = "none";
    }, 7700);
  </script>
</body>
</html>
